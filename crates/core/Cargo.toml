[package]
name = "bookmind-core"
edition.workspace = true
version.workspace = true

[features]
# Включает FakeLlm для тестов в других крейтах.
fake = []

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.42"
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
