[package]
name = "bookmind-eval"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
bookmind-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
